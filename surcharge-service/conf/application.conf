# env vars override where noted

play.http.secret.key = "local-development-only-secret-not-used-in-any-environment"
play.http.secret.key = ${?APPLICATION_SECRET}

# only other services call us so there are no browser sessions (no csrf), and the
# payments api reaches us by its container name
play.filters.disabled += "play.filters.csrf.CSRFFilter"
play.filters.hosts.allowed = ["."]

surcharge {
  bins.resource = "bins.csv.gz"
  merchants.resource = "merchants.json"
  # How long a merchant's config is served from cache. An opt-out (rule 6) or a rate change made in
  # onboarding takes effect within this long. 0 turns the cache off. MERCHANT_CACHE_TTL needs a
  # unit, e.g. 30s or "30 seconds": a bare number is read as milliseconds
  merchants.cacheTtl = 30 seconds
  merchants.cacheTtl = ${?MERCHANT_CACHE_TTL}

  # The onboarding client blocks its thread for the whole call, so it runs here and never on
  # Play's default dispatcher, which also serves HTTP. Calls beyond the pool size queue for a
  # thread. A found merchant is fetched at most once per TTL, but unknown merchants and failed
  # calls go to onboarding every time: nothing caches or rate-limits them. The queue is unbounded
  # and the call has no timeout, so a flood of unknown ids or a hung onboarding service queues
  # without limit (as it did on the default dispatcher before)
  onboarding.dispatcher {
    executor = "thread-pool-executor"
    throughput = 1
    thread-pool-executor {
      fixed-pool-size = 16
    }
  }

  # HMAC-SHA256 key for signing quotes, shared with the payments api (docs/quote-contract.md).
  # At least 32 bytes (UTF-8).  The service logs a warning at startup while the dev default is in use
  quoteSigning {
    devDefaultKey = "local-development-only-quote-signing-key-not-used-in-any-environment"
    key = ${surcharge.quoteSigning.devDefaultKey}
    key = ${?QUOTE_SIGNING_KEY}
    devDefaultKeyId = "dev-1"
    keyId = ${surcharge.quoteSigning.devDefaultKeyId}
    keyId = ${?QUOTE_SIGNING_KEY_ID}
  }
}
